name: PR - Firebase App Distribution

on:
  pull_request:
    types: [ labeled, synchronize ]

concurrency:
  group: pr-firebase-distribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-firebase-debug-apk:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'app-distribution') &&
      (github.event.action != 'labeled' || github.event.label.name == 'app-distribution') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Create secret.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > secret.properties
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Write release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          {
            echo "PR #${PR_NUMBER}: ${PR_TITLE}"
            echo "Branch: ${PR_BRANCH}"
            echo
            echo "Last commit: $(git log -1 --format='%h %s')"
          } > release-notes.txt
          cat release-notes.txt
      - name: upload debug apk to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DEBUG }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers-debug
          releaseNotesFile: release-notes.txt
          file: app/build/outputs/apk/debug/app-debug.apk
