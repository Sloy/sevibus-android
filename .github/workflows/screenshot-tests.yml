name: Screenshot Tests

# Opt-in while the screenshot suite is being battle tested:
# run it manually, or add the "screenshots" label to a pull request.
on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    types: [ opened, synchronize, reopened, labeled ]

permissions:
  contents: read
  checks: write

jobs:
  screenshots:
    name: Validate Screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'screenshots')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Create secret.properties
        run: echo "MAPS_API_KEY=dummy_key" > secret.properties
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: Validate screenshots
        run: ./gradlew :app:validateDebugScreenshotTest
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Screenshot test results
          report_paths: app/build/test-results/validateDebugScreenshotTest/*.xml
          detailed_summary: true
          include_passed: false
      - name: Upload screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
          retention-days: 14
