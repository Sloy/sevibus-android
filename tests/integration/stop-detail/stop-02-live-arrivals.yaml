appId: ${APP_ID}
name: "STOP-02 Stop detail shows the arrivals returned by the server"
tags:
  - stop-detail
  - level1
---
- runFlow: ../../subflows/launch-mocked.yaml
- evalScript: ${ output.mocks.set('arrivals-844', 'fixed') }
- runFlow:
    file: ../../subflows/search.yaml
    env:
      QUERY: "estacion cercanias"
- tapOn: "Parada 844"
- extendedWaitUntil:
    visible: "2 min"
    timeout: 20000
- assertVisible: "5 min"
- assertNotVisible: "Ocurrió un error al cargar los tiempos.*"
