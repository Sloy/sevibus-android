appId: ${APP_ID}
name: "STOP-04 Stop with no buses shows every line as not available"
tags:
  - stop-detail
  - level3
---
# An empty arrivals list means no bus is expected: every line of the stop shows "No disponible".
- runFlow: ../../subflows/launch-mocked.yaml
- evalScript: ${ output.mocks.set('arrivals-844', 'empty') }
- runFlow:
    file: ../../subflows/search.yaml
    env:
      QUERY: "estacion cercanias"
- tapOn: "Parada 844"
- extendedWaitUntil:
    visible:
      text: "No disponible"
      index: 2
    timeout: 20000
- assertVisible: "Rochelambert"
- assertVisible: "Cerro Del Aguila"
- assertVisible: "Poligono Sur"
- assertNotVisible: "Ocurrió un error al cargar los tiempos.*"
