appId: ${APP_ID}
name: "CONN-01 Offline: cached transit data stays searchable and arrivals show a connection error"
tags:
  - connectivity
  - search
  - stop-detail
  - level1
---
- runFlow: ../../subflows/launch-mocked.yaml
- tapOn: "Líneas"
- extendedWaitUntil:
    visible: "Transversales"
    timeout: 20000
- tapOn: "Para ti"
# Airplane mode would also cut the wireless adb connection of a real device.
# Relaunching against a port nobody listens on makes every request fail the same way.
- stopApp
- launchApp:
    arguments:
      debugApiHost: "http://localhost:9"
      debugMapMode: ${MAP_MODE}
- extendedWaitUntil:
    visible: "Para ti"
    timeout: 30000
- runFlow:
    file: ../../subflows/search.yaml
    env:
      QUERY: "estacion cercanias"
- tapOn: "Parada 844"
- extendedWaitUntil:
    visible: "Ocurrió un error al cargar los tiempos.*"
    timeout: 20000
- assertVisible: "San Bernardo"
