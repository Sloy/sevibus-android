appId: ${APP_ID}
name: "CARDS-04 Adding a valid card shows its balance and activity, and it can be deleted"
tags:
  - cards
  - mocks
  - level2
---
# The app formats amounts with a non-breaking space before the euro sign, so the selectors use "." for it.
- runFlow: ../../subflows/launch-mocked.yaml
- evalScript: ${ output.mocks.set('card-123456789012', 'valid') }
- tapOn: "Bonobús"
- extendedWaitUntil:
    visible: "Añadir tarjeta"
    timeout: 10000
- tapOn: "Número de serie"
- inputText: "123456789012"
- extendedWaitUntil:
    visible: "12,50.€"
    timeout: 15000
- assertVisible: "Bonobús sin transbordo"
- scrollUntilVisible:
    element: "Actividad reciente"
    direction: DOWN
    timeout: 10000
- assertVisible: "Validación"
- assertVisible: "-0,41.€"
- scrollUntilVisible:
    element: "Eliminar"
    direction: DOWN
    timeout: 10000
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "Añadir tarjeta"
    timeout: 10000
- assertNotVisible: "12,50.€"
