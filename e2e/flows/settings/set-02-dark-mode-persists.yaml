appId: ${APP_ID}
name: "SET-02 Dark mode preference survives an app restart"
tags:
  - settings
  - level1
---
- runFlow: ../../subflows/launch-fresh.yaml
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Modo oscuro"
    timeout: 10000
- assertVisible: "Predeterminado del sistema"
- tapOn: "Modo oscuro"
- tapOn: "Siempre"
- extendedWaitUntil:
    notVisible: "Nunca"
    timeout: 5000
- stopApp
- launchApp
- runFlow: ../../subflows/dismiss-review-dialog.yaml
- extendedWaitUntil:
    visible: "Para ti"
    timeout: 30000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Modo oscuro"
    timeout: 10000
- assertVisible: "Siempre"
- assertNotVisible: "Predeterminado del sistema"
