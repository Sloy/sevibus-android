appId: ${APP_ID}
name: "SET-03 Disabling anonymous analytics survives an app restart"
tags:
  - settings
  - level1
---
# The switch has no label of its own, so it is located relative to its title.
- runFlow: ../../subflows/launch-fresh.yaml
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Permitir estadísticas anónimas"
    timeout: 10000
- assertVisible:
    checked: true
    rightOf: "Permitir estadísticas anónimas"
- tapOn:
    checked: true
    rightOf: "Permitir estadísticas anónimas"
- assertVisible:
    checked: false
    rightOf: "Permitir estadísticas anónimas"
- stopApp
- launchApp
- runFlow: ../../subflows/dismiss-review-dialog.yaml
- extendedWaitUntil:
    visible: "Para ti"
    timeout: 30000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Permitir estadísticas anónimas"
    timeout: 10000
- assertVisible:
    checked: false
    rightOf: "Permitir estadísticas anónimas"
- assertNotVisible:
    checked: true
    rightOf: "Permitir estadísticas anónimas"
