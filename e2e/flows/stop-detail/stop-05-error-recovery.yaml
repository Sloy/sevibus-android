appId: ${APP_ID}
name: "STOP-05 Arrivals error recovers on the next poll"
tags:
  - stop-detail
  - mocks
  - level1
---
- runFlow: ../../subflows/launch-mocked.yaml
- evalScript: ${ output.mocks.set('arrivals-844', 'error') }
- runFlow:
    file: ../../subflows/search.yaml
    env:
      QUERY: "estacion cercanias"
- tapOn: "Stop 844"
- extendedWaitUntil:
    visible: "An error occurred while loading arrival times.*"
    timeout: 20000
- evalScript: ${ output.mocks.set('arrivals-844', 'fixed') }
- extendedWaitUntil:
    visible: "2 min"
    timeout: 30000
- assertNotVisible: "An error occurred while loading arrival times.*"
