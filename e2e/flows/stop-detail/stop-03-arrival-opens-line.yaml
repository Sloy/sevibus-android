appId: ${APP_ID}
name: "STOP-03 Tapping a line arrival opens the line route with the stop highlighted"
tags:
  - stop-detail
  - lines
  - mocks
  - level1
---
- runFlow: ../../subflows/launch-mocked.yaml
- evalScript: ${ output.mocks.set('arrivals-844', 'fixed') }
- runFlow:
    file: ../../subflows/search.yaml
    env:
      QUERY: "estacion cercanias"
- tapOn: "Stop 844"
- extendedWaitUntil:
    visible: "Rochelambert"
    timeout: 20000
- tapOn:
    text: "Rochelambert"
    index: 0
- extendedWaitUntil:
    visible: "Origen"
    timeout: 15000
- assertVisible: "Destino"
- assertVisible: "Stop 844"
